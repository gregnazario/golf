[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "golf-format"
version = "0.1.0"
description = "Read-only indexed storage file format for time-series range queries"
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
license = {text = "Apache-2.0"}
dependencies = [
    "lz4>=4.3.0",
    "zstandard>=0.22.0",
    "crc32c>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
